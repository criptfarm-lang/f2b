<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отчёт ОП — F2B PRO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f7ff; color: #1e1b4b; min-height: 100vh; }
.header { background: #fff; border-bottom: 1px solid #e8e5f5; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 18px; font-weight: 600; color: #1e1b4b; }
.header .date { font-size: 13px; color: #6b7280; }
.container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
.card { background: #fff; border-radius: 12px; border: 1px solid #e8e5f5; padding: 14px 16px; }
.card .label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.card .value { font-size: 22px; font-weight: 600; color: #1e1b4b; }
.card .pct { font-size: 12px; margin-top: 4px; }
.pct.good { color: #059669; }
.pct.warn { color: #d97706; }
.pct.bad { color: #dc2626; }
.tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab { padding: 8px 16px; border-radius: 20px; border: 1.5px solid #e8e5f5; background: #fff; cursor: pointer; font-size: 13px; font-weight: 500; color: #6b7280; transition: all 0.15s; }
.tab.active { background: #7c3aed; border-color: #7c3aed; color: #fff; }
.tab:hover:not(.active) { border-color: #a78bfa; color: #7c3aed; }
.chart-wrap { background: #fff; border-radius: 12px; border: 1px solid #e8e5f5; padding: 20px; margin-bottom: 20px; }
.chart-title { font-size: 14px; font-weight: 500; color: #1e1b4b; margin-bottom: 16px; }
.mgr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
.mgr-card { background: #fff; border-radius: 12px; border: 1px solid #e8e5f5; padding: 16px; cursor: pointer; transition: all 0.15s; }
.mgr-card:hover { border-color: #a78bfa; box-shadow: 0 2px 8px rgba(124,58,237,0.08); }
.mgr-card.selected { border-color: #7c3aed; border-width: 2px; }
.mgr-card .name { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: #1e1b4b; }
.mgr-card .lost { font-size: 11px; color: #dc2626; margin-top: 6px; }
.metric-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.metric-row .m-label { font-size: 11px; color: #6b7280; }
.metric-row .m-val { font-size: 12px; font-weight: 500; color: #1e1b4b; }
.bar-mini { height: 4px; background: #e8e5f5; border-radius: 2px; margin-bottom: 2px; }
.bar-mini-fill { height: 100%; border-radius: 2px; background: #7c3aed; }
.detail-panel { background: #fff; border-radius: 12px; border: 1px solid #e8e5f5; padding: 20px; }
.detail-panel h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.loading { text-align: center; padding: 60px 20px; color: #6b7280; font-size: 15px; }
.spinner { width: 32px; height: 32px; border: 3px solid #e8e5f5; border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.metric-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.m-detail-card { background: #f8f7ff; border-radius: 8px; padding: 12px; }
.m-detail-card .dl { font-size: 11px; color: #6b7280; margin-bottom: 4px; }
.m-detail-card .df { font-size: 18px; font-weight: 600; }
.m-detail-card .dp { font-size: 11px; margin-top: 2px; }
</style>
</head>
<body>

<div class="header">
  <h1>Отчёт ОП — F2B PRO</h1>
  <span class="date" id="report-date">Загрузка...</span>
</div>

<div class="container">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    Загружаю данные из МойСклад...
  </div>

  <div id="content" style="display:none">
    <!-- Сводные карточки -->
    <div class="summary" id="summary-cards"></div>

    <!-- Табы по менеджерам -->
    <div class="tabs" id="mgr-tabs"></div>

    <!-- График -->
    <div class="chart-wrap">
      <div class="chart-title" id="chart-title">Выполнение плана</div>
      <div style="position:relative; height:320px;">
        <canvas id="mainChart"></canvas>
      </div>
    </div>

    <!-- Карточки менеджеров -->
    <div class="mgr-grid" id="mgr-cards"></div>

    <!-- Детальная панель -->
    <div class="detail-panel" id="detail-panel" style="display:none">
      <h3 id="detail-name"></h3>
      <div class="metric-detail" id="detail-metrics"></div>
    </div>
  </div>
</div>

<script>
const DATA = __REPORT_DATA__;

const COLORS = ['#7c3aed','#a855f7','#c084fc','#e879f9','#f0abfc'];
const MGR_COLORS = { 'Инесса': '#7c3aed', 'Карина': '#a855f7', 'Елена': '#c084fc', 'Алексей': '#e879f9' };

const METRICS_CONFIG = [
  { key: 'revenue',     label: 'Выручка',      divisor: 1e6, suffix: 'млн' },
  { key: 'shipments',   label: 'Отгрузки',      divisor: 1,   suffix: '' },
  { key: 'clients',     label: 'Клиенты',       divisor: 1,   suffix: '' },
  { key: 'new_clients', label: 'Новых клиентов',divisor: 1,   suffix: '' },
  { key: 'attracted',   label: 'Привл.товары',  divisor: 1e6, suffix: 'млн' },
];

let chart = null;
let selectedMgr = 'all';

function pct(fact, plan) {
  if (!plan) return 0;
  return Math.round(fact / plan * 100);
}

function pctClass(p) {
  if (p >= 80) return 'good';
  if (p >= 50) return 'warn';
  return 'bad';
}

function fmt(val, divisor, suffix) {
  const v = val / divisor;
  return (divisor === 1e6 ? v.toFixed(1) : Math.round(v)) + (suffix ? ' ' + suffix : '');
}

function renderSummary() {
  const totals = { plan: {}, fact: {} };
  METRICS_CONFIG.forEach(m => {
    totals.plan[m.key] = Object.values(DATA.plans).reduce((s, p) => s + (p[m.key] || 0), 0);
    totals.fact[m.key] = Object.values(DATA.facts).reduce((s, f) => s + (f[m.key] || 0), 0);
  });

  const html = METRICS_CONFIG.map(m => {
    const p = pct(totals.fact[m.key], totals.plan[m.key]);
    return `<div class="card">
      <div class="label">${m.label}</div>
      <div class="value">${fmt(totals.fact[m.key], m.divisor, m.suffix)}</div>
      <div class="pct ${pctClass(p)}">${p}% из ${fmt(totals.plan[m.key], m.divisor, m.suffix)}</div>
    </div>`;
  }).join('');
  document.getElementById('summary-cards').innerHTML = html;
}

function renderTabs() {
  const mgrs = Object.keys(DATA.facts);
  const tabs = [{ id: 'all', label: 'Все' }, ...mgrs.map(m => ({ id: m, label: DATA.short_names[m] || m }))];
  document.getElementById('mgr-tabs').innerHTML = tabs.map(t =>
    `<div class="tab ${t.id === selectedMgr ? 'active' : ''}" onclick="selectMgr('${t.id}')">${t.label}</div>`
  ).join('');
}

function renderChart() {
  const mgrs = selectedMgr === 'all' ? Object.keys(DATA.facts) : [selectedMgr];
  const labels = mgrs.map(m => DATA.short_names[m] || m);

  const datasets = METRICS_CONFIG.map((m, i) => ({
    label: m.label,
    data: mgrs.map(mgr => Math.round((DATA.facts[mgr]?.[m.key] || 0) / m.divisor * 10) / 10),
    backgroundColor: COLORS[i] + '99',
    borderColor: COLORS[i],
    borderWidth: 1,
  }));

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('mainChart'), {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: true, position: 'bottom', labels: { font: { size: 11 }, boxWidth: 10 } },
        tooltip: {
          callbacks: {
            label: ctx => {
              const m = METRICS_CONFIG[ctx.datasetIndex];
              const plan = (DATA.plans[mgrs[ctx.dataIndex]]?.[m.key] || 0) / m.divisor;
              const fact = ctx.raw;
              const p = plan ? Math.round(fact / plan * 100) : 0;
              return ` ${m.label}: ${fact}${m.suffix} / план ${Math.round(plan * 10)/10}${m.suffix} (${p}%)`;
            }
          }
        }
      },
      scales: {
        x: { grid: { display: false } },
        y: { grid: { color: '#f0effe' }, ticks: { font: { size: 11 } } }
      }
    }
  });

  document.getElementById('chart-title').textContent =
    selectedMgr === 'all' ? 'Выполнение плана — все менеджеры' : `Выполнение плана — ${selectedMgr}`;
}

function renderMgrCards() {
  const mgrs = selectedMgr === 'all' ? Object.keys(DATA.facts) : [selectedMgr];
  document.getElementById('mgr-cards').innerHTML = mgrs.map(m => {
    const f = DATA.facts[m] || {};
    const p = DATA.plans[m] || {};
    const short = DATA.short_names[m] || m;
    const lost = f.lost_clients || 0;

    const rows = METRICS_CONFIG.map(mc => {
      const fv = (f[mc.key] || 0) / mc.divisor;
      const pv = (p[mc.key] || 0) / mc.divisor;
      const pc = pv ? Math.min(fv / pv, 1) : 0;
      return `<div class="metric-row">
        <span class="m-label">${mc.label}</span>
        <span class="m-val">${fmt(f[mc.key]||0, mc.divisor, mc.suffix)}</span>
      </div>
      <div class="bar-mini"><div class="bar-mini-fill" style="width:${Math.round(pc*100)}%; background:${MGR_COLORS[short]||'#7c3aed'}"></div></div>`;
    }).join('');

    return `<div class="mgr-card ${m === selectedMgr ? 'selected' : ''}" onclick="showDetail('${m}')">
      <div class="name">${short}</div>
      ${rows}
      ${lost > 0 ? `<div class="lost">▼ выбыли: -${lost}</div>` : ''}
    </div>`;
  }).join('');
}

function showDetail(mgr) {
  const f = DATA.facts[mgr] || {};
  const p = DATA.plans[mgr] || {};
  const short = DATA.short_names[mgr] || mgr;

  document.getElementById('detail-name').textContent = short;
  document.getElementById('detail-metrics').innerHTML = METRICS_CONFIG.map(m => {
    const fv = fmt(f[m.key]||0, m.divisor, m.suffix);
    const pv = fmt(p[m.key]||0, m.divisor, m.suffix);
    const pc = pct(f[m.key]||0, p[m.key]||0);
    return `<div class="m-detail-card">
      <div class="dl">${m.label}</div>
      <div class="df">${fv}</div>
      <div class="dp ${pctClass(pc)}">${pc}% из ${pv}</div>
    </div>`;
  }).join('');

  document.getElementById('detail-panel').style.display = 'block';
  document.getElementById('detail-panel').scrollIntoView({ behavior: 'smooth' });
}

function selectMgr(id) {
  selectedMgr = id;
  renderTabs();
  renderChart();
  renderMgrCards();
  document.getElementById('detail-panel').style.display = 'none';
}

function init() {
  document.getElementById('report-date').textContent = DATA.date;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  renderSummary();
  renderTabs();
  renderChart();
  renderMgrCards();
}

init();
</script>
</body>
</html>
